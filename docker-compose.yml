version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./ml:/app/ml
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite:///./data/wildtrace.db
      - FAISS_INDEX_PATH=/app/data/faiss_index/wildtrace.index
      - UPLOAD_DIR=/app/data/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:8000
